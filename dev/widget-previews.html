<!DOCTYPE html>
<!--
  The widget's store previews (widgets/upcoming/preview-light.png and -dark.png, 1024x1024):
  abstract like Widgetkeeper's (bars for text, no words), with the real waste type icons.
  ?theme=dark|light. Rendered by `node scripts/render.mjs previews`.
-->
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; background: transparent; }
    [hidden] { display: none !important; }
    body { width: 1024px; height: 1024px; display: grid; place-items: center; }
    .card { width: 800px; padding: 52px 48px; border-radius: 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 52px; }
    .dark .card { background: #1F2029; box-shadow: 0 24px 60px rgba(0,0,0,.28); --t: #CFD0D4; --m: #6E6F78; --n: #33343F; }
    .light .card { background: #FFFFFF; box-shadow: 0 24px 60px rgba(20,24,40,.12); --t: #41424B; --m: #A9AAB1; --n: #EDEDF0; }
    .row { display: grid; grid-template-columns: 112px 1fr auto; column-gap: 40px; align-items: center; }
    .icon { position: relative; width: 112px; height: 112px; }
    .icon img { width: 100%; height: 100%; border-radius: 28px; display: block; }
    .icon .sub { position: absolute; right: -16px; bottom: -16px; width: 60px; height: 60px; border-radius: 18px; }
    .dark .icon .sub { box-shadow: 0 0 0 6px #1F2029; }
    .light .icon .sub { box-shadow: 0 0 0 6px #FFFFFF; }
    .bars { display: flex; flex-direction: column; gap: 22px; }
    .bar { height: 30px; border-radius: 15px; background: var(--t); }
    .bar.m { height: 24px; border-radius: 12px; background: var(--m); }
    .pill { width: 150px; height: 76px; border-radius: 38px; display: grid; place-items: center; }
    .pill i { display: block; width: 84px; height: 26px; border-radius: 13px; }
    .pill.today { background: #267700; } .pill.today i { background: #fff; }
    .pill.tomorrow { background: var(--n); } .pill.tomorrow i { background: var(--t); }
    .pill.later { background: none; } .pill.later i { background: var(--m); width: 110px; height: 24px; }
    .ov-card { padding: 64px 56px; }
    .ov { display: grid; grid-template-columns: repeat(4, 1fr); gap: 52px 24px; justify-items: center; }
    .ov .t { display: flex; flex-direction: column; align-items: center; gap: 22px; }
    .ov img { width: 120px; height: 120px; border-radius: 30px; display: block; }
    .ov .p { width: 104px; height: 60px; border-radius: 30px; display: grid; place-items: center; }
    .ov .p i { display: block; width: 52px; height: 22px; border-radius: 11px; background: var(--m); }
    .ov .p.today { background: #267700; } .ov .p.today i { background: #fff; }
    .ov .p.tomorrow { background: var(--n); } .ov .p.tomorrow i { background: var(--t); }
    .cal-card { gap: 36px; }
    .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 14px; }
    .cell { aspect-ratio: 1; border-radius: 22px; display: grid; place-items: center; }
    .cell img { width: 100%; height: 100%; border-radius: 22px; display: block; }
    .cell i { display: block; width: 34px; height: 18px; border-radius: 9px; background: var(--m); opacity: .7; }
    .cell.past i { opacity: .3; }
    .dark .cell.today { box-shadow: 0 0 0 7px #1F2029, 0 0 0 14px #267700; }
    .light .cell.today { box-shadow: 0 0 0 7px #fff, 0 0 0 14px #267700; }
  </style>
</head>
<body>
  <div class="card">
    <div class="row"><div class="icon"><img src="../widgets/upcoming/public/icons/restaffaldmadaffald.svg"></div>
      <div class="bars"><div class="bar" style="width:62%"></div><div class="bar m" style="width:48%"></div></div><div class="pill today"><i></i></div></div>
    <div class="row"><div class="icon"><img src="../widgets/upcoming/public/icons/farligtaffald.svg"><img class="sub" src="../widgets/upcoming/public/icons/tekstil.svg"></div>
      <div class="bars"><div class="bar" style="width:78%"></div><div class="bar m" style="width:52%"></div></div><div class="pill tomorrow"><i></i></div></div>
    <div class="row"><div class="icon"><img src="../widgets/upcoming/public/icons/pappi.svg"></div>
      <div class="bars"><div class="bar" style="width:56%"></div><div class="bar m" style="width:44%"></div></div><div class="pill later"><i></i></div></div>
    <div class="row"><div class="icon"><img src="../widgets/upcoming/public/icons/metalglas.svg"></div>
      <div class="bars"><div class="bar" style="width:42%"></div><div class="bar m" style="width:50%"></div></div><div class="pill later"><i></i></div></div>
  </div>
  <div class="card ov-card" hidden><div class="ov"></div></div>
  <div class="card cal-card" hidden>
    <div class="bar" style="width:46%;height:34px;border-radius:17px"></div>
    <div class="cal"></div>
  </div>
  <script>
    var params = new URLSearchParams(location.search);
    document.body.className = params.get('theme') || 'dark';
    if (params.get('w') === 'overview') {
      document.querySelector('.card:not(.cal-card):not(.ov-card)').remove();
      var ovCard = document.querySelector('.ov-card');
      ovCard.hidden = false;
      [['restaffaldmadaffald', 'today'], ['farligtaffald', 'tomorrow'], ['glas', ''], ['papir', ''], ['pap', ''], ['metalglas', ''], ['tekstil', ''], ['haveaffald', '']].forEach(function (x) {
        var tile = document.createElement('div'); tile.className = 't';
        tile.innerHTML = '<img src="../widgets/upcoming/public/icons/' + x[0] + '.svg"><div class="p ' + x[1] + '"><i></i></div>';
        ovCard.querySelector('.ov').appendChild(tile);
      });
    }
    if (params.get('w') === 'calendar') {
      document.querySelector('.card:not(.cal-card)').remove();
      var card = document.querySelector('.cal-card');
      card.hidden = false;
      var cal = card.querySelector('.cal');
      var picks = { 1: 'restaffaldmadaffald', 2: 'farligtaffald', 10: 'pappi', 15: 'restaffaldmadaffald', 18: 'metalglas', 24: 'pappi', 29: 'restaffaldmadaffald' };
      for (var i = 0; i < 35; i++) {
        var c = document.createElement('div');
        c.className = 'cell' + (i === 1 ? ' today' : '') + (i < 1 ? ' past' : '');
        if (picks[i]) { var im = document.createElement('img'); im.src = '../widgets/upcoming/public/icons/' + picks[i] + '.svg'; c.appendChild(im); }
        else { var b = document.createElement('i'); c.appendChild(b); }
        cal.appendChild(c);
      }
    }
  </script>
</body>
</html>
