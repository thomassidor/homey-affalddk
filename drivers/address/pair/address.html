<!--
  Pairing: find the address, pick it, see its upcoming pickups, add it.

  Homey injects pair views into its own pairing document (no iframe), so every
  CSS rule is scoped to #ad-pair and ids carry an ad- prefix. Homey paints the
  pairing sheet light whatever the phone's theme, so there is no dark scheme.
  Design language from Lightkeeper's pairing screens: 20/15/13 type, 12 px
  fields and tiles, one solid primary button, messages as soft panels.
-->
<style>
  #ad-pair {
    --ad-accent: #2E7D32;
    --ad-accent-ink: #ffffff;
    --ad-accent-tint: #EFF6EF;
    --ad-accent-strong: #1B5E20;
    --ad-ring: rgba(46, 125, 50, .18);
    --ad-ink: #16181d;
    --ad-body: #4b5563;
    --ad-muted: #6a7180;
    --ad-surface: #ffffff;
    --ad-edge: #dfe3e9;
    --ad-line: #eceef2;
    --ad-hover: #c9d2e0;
    --ad-chev: #8f97a3;
    --ad-flat: #f4f5f7;
    --ad-bad-bg: #fdeceb;
    --ad-bad-ink: #8f1d18;
    padding: 18px 16px 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color: var(--ad-ink);
    -webkit-font-smoothing: antialiased;
  }
  #ad-pair * { box-sizing: border-box; }
  #ad-pair [hidden] { display: none !important; }

  #ad-pair .steps { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; }
  #ad-pair .steps i { width: 22px; height: 4px; border-radius: 999px; background: var(--ad-edge); }
  #ad-pair .steps i.on { background: var(--ad-accent); }
  #ad-pair .steps span { margin-inline-start: 4px; font-size: 13px; color: var(--ad-muted); }

  #ad-pair h2 { margin: 0 0 6px; font-size: 20px; line-height: 1.3; font-weight: 700; letter-spacing: -.01em; color: var(--ad-ink); }
  #ad-pair .sub { margin: 0 0 20px; font-size: 15px; line-height: 1.5; color: var(--ad-body); }

  #ad-pair .field { margin-bottom: 14px; min-width: 0; }
  #ad-pair .field label { display: block; margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--ad-ink); }
  #ad-pair .field label small { font-weight: 400; color: var(--ad-muted); }
  #ad-pair .pair { display: flex; gap: 10px; }
  #ad-pair .pair .half { flex: 1 1 0; }

  #ad-pair input, #ad-pair select {
    width: 100%; margin: 0; padding: 12px 13px; font-size: 16px; line-height: 1.25; font-family: inherit;
    border: 1.5px solid var(--ad-edge); border-radius: 12px; background: var(--ad-surface); color: var(--ad-ink);
    -webkit-appearance: none; appearance: none; transition: border-color .12s ease, box-shadow .12s ease;
  }
  #ad-pair select {
    padding-inline-end: 38px;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%236a7180' d='M1 1.5 6 6.5l5-5'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 14px center; background-size: 12px 8px;
  }
  #ad-pair input::placeholder { color: #a3a9b3; }
  #ad-pair input:focus, #ad-pair select:focus { outline: none; border-color: var(--ad-accent); box-shadow: 0 0 0 3px var(--ad-ring); }
  #ad-pair .field input[aria-invalid="true"] { border-color: #d9534f; }
  #ad-pair .field input[aria-invalid="true"]:focus { box-shadow: 0 0 0 3px rgba(217, 83, 79, .18); }

  #ad-pair .btn-primary {
    display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 50px;
    margin-top: 6px; padding: 14px; border: none; border-radius: 12px;
    background: var(--ad-accent); color: var(--ad-accent-ink);
    font-family: inherit; font-size: 16px; font-weight: 600; line-height: 1.2; cursor: pointer; transition: background .12s ease;
  }
  #ad-pair .btn-primary:active { background: var(--ad-accent-strong); }
  #ad-pair .btn-primary:disabled { background: var(--ad-line); color: var(--ad-chev); cursor: progress; }
  #ad-pair .btn-primary .spin { border-color: currentColor; border-right-color: transparent; }

  #ad-pair .link {
    display: inline-flex; align-items: center; gap: 4px; min-height: 32px; padding: 0; border: none; background: none;
    font-family: inherit; font-size: 15px; font-weight: 600; line-height: 1.2; color: var(--ad-accent); cursor: pointer;
  }

  #ad-pair .msg { margin: 14px 0 0; padding: 12px 13px; border-radius: 12px; font-size: 14px; line-height: 1.45; }
  #ad-pair .msg.bad { background: var(--ad-bad-bg); color: var(--ad-bad-ink); }
  #ad-pair .note { margin: 18px 0 0; font-size: 13px; line-height: 1.5; color: var(--ad-muted); }

  /* Step 2: the address list. A tile is a radio; the chosen one opens its pickup preview. */
  #ad-pair .head-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 12px; }
  #ad-pair .head-row .count { font-size: 13px; color: var(--ad-muted); }
  #ad-pair .list { display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px; }
  #ad-pair .tile {
    width: 100%; text-align: start; padding: 0; border: 1.5px solid var(--ad-edge); border-radius: 12px;
    background: var(--ad-surface); color: var(--ad-ink); font: inherit; cursor: pointer;
    transition: border-color .12s ease, background .12s ease;
  }
  #ad-pair .tile:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ad-ring); }
  #ad-pair .tile.sel { border-color: var(--ad-accent); background: var(--ad-accent-tint); cursor: default; }
  #ad-pair .tile-top { display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 12px 14px; }
  #ad-pair .radio {
    flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #d4d8e0; background: var(--ad-surface);
    display: grid; place-items: center; transition: border-color .12s ease;
  }
  #ad-pair .tile.sel .radio { border-color: var(--ad-accent); }
  #ad-pair .tile.sel .radio::after { content: ''; width: 12px; height: 12px; border-radius: 50%; background: var(--ad-accent); }
  #ad-pair .tile .name { flex: 1; min-width: 0; font-size: 15px; font-weight: 500; line-height: 1.3; overflow-wrap: anywhere; }

  #ad-pair .preview { padding: 0 14px 12px 48px; }
  #ad-pair .preview .state { display: flex; align-items: center; gap: 8px; padding: 2px 0 2px; font-size: 13px; color: var(--ad-muted); }
  #ad-pair .preview .state.bad { color: var(--ad-bad-ink); }
  #ad-pair .preview .title { margin: 2px 0 6px; font-size: 13px; font-weight: 600; color: var(--ad-body); }
  #ad-pair .prow { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  #ad-pair .prow + .prow { border-top: 1px solid rgba(46, 125, 50, .14); }
  #ad-pair .prow img { flex: none; width: 28px; height: 28px; border-radius: 7px; }
  #ad-pair .prow .pname { flex: 1; min-width: 0; font-size: 15px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ad-pair .prow .pwhen { flex: none; text-align: end; font-size: 13px; line-height: 1.3; color: var(--ad-muted); }
  #ad-pair .prow .pwhen b { display: block; font-size: 14px; font-weight: 600; color: var(--ad-ink); }
  #ad-pair .prow.soon .pwhen b { color: var(--ad-accent); }

  /* The add button stays reachable however long the list is. */
  #ad-pair .dock {
    position: sticky; bottom: 0; margin: 0 -16px -24px; padding: 12px 16px 20px;
    background: linear-gradient(to bottom, rgba(255, 255, 255, 0), #ffffff 18px);
  }

  #ad-pair .spin {
    flex: none; width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--ad-chev); border-right-color: transparent; animation: ad-spin .8s linear infinite;
  }
  @keyframes ad-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #ad-pair .spin { animation-duration: 2s; } }
</style>

<div id="ad-pair">
  <!-- Step 1: search -->
  <form id="ad-search" novalidate>
    <div class="steps" aria-hidden="true"><i class="on"></i><i></i><span data-ad-i18n="pair.step1"></span></div>
    <h2 data-ad-i18n="pair.title"></h2>
    <p class="sub" data-ad-i18n="pair.intro"></p>

    <div class="field">
      <label for="ad-municipality" data-ad-i18n="pair.municipality"></label>
      <select id="ad-municipality" autocomplete="off"></select>
    </div>
    <div class="field">
      <label for="ad-street" data-ad-i18n="pair.street"></label>
      <input id="ad-street" type="text" autocomplete="address-line1" autocapitalize="words" spellcheck="false" data-ad-placeholder="pair.street_placeholder">
    </div>
    <div class="pair">
      <div class="field half">
        <label for="ad-house" data-ad-i18n="pair.house_number"></label>
        <input id="ad-house" type="text" autocomplete="off" spellcheck="false" data-ad-placeholder="pair.optional">
      </div>
      <div class="field half">
        <label for="ad-zip" data-ad-i18n="pair.zipcode"></label>
        <input id="ad-zip" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="postal-code" placeholder="0000">
      </div>
    </div>

    <div class="msg bad" id="ad-search-error" role="alert" hidden></div>
    <button type="submit" class="btn-primary" id="ad-search-btn"><span data-ad-i18n="pair.search"></span></button>
    <p class="note" data-ad-i18n="pair.unsupported_note"></p>
  </form>

  <!-- Step 2: choose -->
  <section id="ad-choose" hidden>
    <div class="steps" aria-hidden="true"><i class="on"></i><i class="on"></i><span data-ad-i18n="pair.step2"></span></div>
    <h2 data-ad-i18n="pair.results"></h2>
    <div class="head-row">
      <span class="count" id="ad-count"></span>
      <button type="button" class="link" id="ad-back"><span aria-hidden="true">‹</span><span data-ad-i18n="pair.edit_search"></span></button>
    </div>
    <div class="list" id="ad-list" role="radiogroup"></div>
    <div class="dock">
      <div class="msg bad" id="ad-add-error" role="alert" hidden></div>
      <button type="button" class="btn-primary" id="ad-add" disabled><span data-ad-i18n="pair.add"></span></button>
    </div>
  </section>
</div>

<script type="application/javascript">
(function () {
  var root = document.getElementById('ad-pair');
  if (!root || root.dataset.booted) return;
  root.dataset.booted = '1';
  var $ = function (id) { return root.querySelector('#' + id); };
  var t = function (key, tokens) { return Homey.__(key, tokens); };

  function node(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function translate() {
    root.querySelectorAll('[data-ad-i18n]').forEach(function (n) { n.textContent = t(n.getAttribute('data-ad-i18n')); });
    root.querySelectorAll('[data-ad-placeholder]').forEach(function (n) { n.placeholder = t(n.getAttribute('data-ad-placeholder')); });
  }

  function busy(btn, on, labelKey) {
    btn.disabled = on;
    btn.replaceChildren();
    if (on) btn.appendChild(node('span', 'spin'));
    btn.appendChild(node('span', null, t(labelKey)));
  }

  function showError(el, err) {
    el.textContent = err ? (err.message || String(err)) : '';
    el.hidden = !err;
  }

  translate();
  if (Homey.setTitle) Homey.setTitle(t('pair.window_title'));

  // ---- step 1 ---------------------------------------------------------------
  var form = $('ad-search');
  var searchBtn = $('ad-search-btn');
  var searchError = $('ad-search-error');
  var lastQuery = null;

  Homey.emit('init').then(function (res) {
    var sel = $('ad-municipality');
    sel.replaceChildren();
    var placeholder = node('option', null, t('pair.choose_municipality'));
    placeholder.value = '';
    placeholder.disabled = true;
    sel.appendChild(placeholder);
    res.municipalities.forEach(function (name) {
      var o = node('option', null, name);
      o.value = name;
      sel.appendChild(o);
    });
    sel.value = res.suggested || '';
    (res.suggested ? $('ad-street') : sel).focus();
  }).catch(function (err) { showError(searchError, err); });

  $('ad-zip').addEventListener('input', function (ev) {
    ev.target.value = ev.target.value.replace(/\D/g, '').slice(0, 4);
  });

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var query = {
      municipality: $('ad-municipality').value,
      zipcode: $('ad-zip').value.trim(),
      street: $('ad-street').value.trim(),
      houseNumber: $('ad-house').value.trim(),
    };
    var missing = !query.municipality ? 'ad-municipality' : !query.street ? 'ad-street' : query.zipcode.length !== 4 ? 'ad-zip' : null;
    ['ad-street', 'ad-zip'].forEach(function (id) { $(id).removeAttribute('aria-invalid'); });
    if (missing) {
      if (missing !== 'ad-municipality') $(missing).setAttribute('aria-invalid', 'true');
      showError(searchError, new Error(t(missing === 'ad-municipality' ? 'pair.unknown_municipality' : 'pair.missing_fields')));
      $(missing).focus();
      return;
    }
    showError(searchError, null);
    busy(searchBtn, true, 'pair.searching');
    Homey.emit('search', query).then(function (list) {
      lastQuery = query;
      showList(list, query);
    }).catch(function (err) {
      showError(searchError, err);
    }).finally(function () {
      busy(searchBtn, false, 'pair.search');
    });
  });

  // ---- step 2 ---------------------------------------------------------------
  var candidate = null;
  var selectSeq = 0;
  var addBtn = $('ad-add');
  var addError = $('ad-add-error');

  function showList(list, query) {
    var ul = $('ad-list');
    ul.replaceChildren();
    $('ad-count').textContent = t(list.length === 1 ? 'pair.found_one' : 'pair.found_many', {
      count: list.length, street: query.street, zipcode: query.zipcode,
    });
    list.forEach(function (name) {
      var tile = node('div', 'tile');
      tile.setAttribute('role', 'radio');
      tile.setAttribute('aria-checked', 'false');
      tile.tabIndex = 0;
      var top = node('div', 'tile-top');
      top.appendChild(node('span', 'radio'));
      top.appendChild(node('span', 'name', name));
      tile.appendChild(top);
      tile.addEventListener('click', function () { choose(tile, name); });
      tile.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(tile, name); }
      });
      ul.appendChild(tile);
    });
    candidate = null;
    showError(addError, null);
    busy(addBtn, false, 'pair.add');
    addBtn.disabled = true;
    form.hidden = true;
    $('ad-choose').hidden = false;
    root.scrollIntoView({ block: 'start' });
    if (list.length === 1) choose(ul.firstChild, list[0]);
  }

  function choose(tile, name) {
    if (tile.classList.contains('sel')) return;
    var seq = ++selectSeq;
    root.querySelectorAll('#ad-list .tile').forEach(function (other) {
      other.classList.remove('sel');
      other.setAttribute('aria-checked', 'false');
      var old = other.querySelector('.preview');
      if (old) old.remove();
    });
    tile.classList.add('sel');
    tile.setAttribute('aria-checked', 'true');
    var preview = node('div', 'preview');
    var loading = node('div', 'state');
    loading.appendChild(node('span', 'spin'));
    loading.appendChild(node('span', null, t('pair.loading_pickups')));
    preview.appendChild(loading);
    tile.appendChild(preview);
    candidate = null;
    addBtn.disabled = true;
    showError(addError, null);

    Homey.emit('select', name).then(function (device) {
      if (seq !== selectSeq) return;
      candidate = device;
      preview.replaceChildren(node('div', 'title', t('pair.preview')));
      device.preview.forEach(function (p) {
        var row = node('div', 'prow' + (p.soon ? ' soon' : ''));
        if (p.icon) {
          var img = node('img');
          img.src = p.icon;
          img.alt = '';
          row.appendChild(img);
        }
        row.appendChild(node('span', 'pname', p.name));
        var when = node('span', 'pwhen');
        when.appendChild(node('b', null, p.when));
        when.appendChild(document.createTextNode(p.date));
        row.appendChild(when);
        preview.appendChild(row);
      });
      addBtn.disabled = false;
    }).catch(function (err) {
      if (seq !== selectSeq) return;
      var bad = node('div', 'state bad', err.message || String(err));
      preview.replaceChildren(bad);
    });
  }

  $('ad-back').addEventListener('click', function () {
    selectSeq++;
    $('ad-choose').hidden = true;
    form.hidden = false;
    $('ad-street').focus();
  });

  addBtn.addEventListener('click', function () {
    if (!candidate) return;
    var device = { name: candidate.name, data: candidate.data, store: candidate.store, settings: candidate.settings };
    showError(addError, null);
    busy(addBtn, true, 'pair.adding');
    Homey.createDevice(device).then(function () {
      Homey.done();
    }).catch(function (err) {
      showError(addError, err);
      busy(addBtn, false, 'pair.add');
    });
  });
})();
</script>
